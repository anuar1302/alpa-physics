<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alpa Physics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap&subset=cyrillic-ext" rel="stylesheet">
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#141a33;--muted:#6b7190;--line:#e6e8f0;--pri:#4f46e5;--pri2:#7c3aed;--acc:#f59e0b;--ok:#10b981;--warn:#f59e0b;--bad:#ef4444;--soft:#eef0ff;--r:18px;--side:#0f1230}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.brand,.num{font-family:Montserrat,Inter,sans-serif}
a{color:inherit;text-decoration:none;cursor:pointer}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(79,70,229,.12)}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin:12px 0 6px}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px 18px;border-radius:12px;font-weight:600;transition:transform .15s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:hover{transform:translateY(-1px)}
.btn-p{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 8px 20px -8px rgba(79,70,229,.7)}
.btn-g{background:#fff;border:1px solid var(--line)}
.btn-a{background:var(--acc);color:#2a1a00;box-shadow:0 8px 20px -8px rgba(245,158,11,.8)}
.btn-w{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25)}
.btn-d{background:#fee2e2;color:#b91c1c}
.btn-s{padding:7px 12px;font-size:13px;border-radius:10px}
.btn-i{padding:6px;border-radius:8px;color:var(--muted)}
.btn-i:hover{background:var(--soft);color:var(--pri)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.wrapf{flex-wrap:wrap}
.g2,.g3,.g4{display:grid;gap:16px}
.g2>*,.g3>*,.g4>*{min-width:0}
.g2{grid-template-columns:repeat(2,1fr)}.g2w{grid-template-columns:1.4fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt24{margin-top:24px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--soft);color:var(--pri)}
.tag.ok{background:#d1fae5;color:#047857}.tag.warn{background:#fef3c7;color:#92400e}.tag.bad{background:#fee2e2;color:#b91c1c}.tag.gray{background:#eef0f4;color:#5b6178}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:600}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.bar{height:8px;border-radius:99px;background:#eceef5;overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--pri),var(--pri2))}
.bar.ok>i{background:var(--ok)}.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:14px;color:#fff;flex:none}
h2.sec{font-size:clamp(26px,3.4vw,38px);line-height:1.15;letter-spacing:-.02em}
.kicker{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--pri)}

/* ---------- landing ---------- */
nav.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(14px);background:rgba(15,18,48,.72);color:#fff;border-bottom:1px solid rgba(255,255,255,.08)}
.nav-in{display:flex;align-items:center;gap:24px;height:66px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:19px;letter-spacing:-.01em}
.brand b{color:var(--acc);font-weight:800}
.links{display:flex;gap:22px;font-size:14px;font-weight:500;opacity:.85;margin-left:12px}
.links a:hover{opacity:1;color:var(--acc)}
.nav-r{margin-left:auto;display:flex;gap:10px;align-items:center}
.lang{font-size:12px;font-weight:700;opacity:.8;padding:6px 10px;border-radius:8px;border:1px solid rgba(255,255,255,.2)}
.hero{position:relative;overflow:hidden;color:#fff;background:radial-gradient(1000px 500px at 85% 10%,rgba(124,58,237,.55),transparent 60%),radial-gradient(800px 500px at 0% 100%,rgba(79,70,229,.5),transparent 60%),#0f1230;margin-top:-66px;padding:130px 0 80px}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:40px;align-items:center}
.hero h1{font-size:clamp(34px,5vw,58px);line-height:1.06;letter-spacing:-.03em;margin:16px 0 18px}
.hero h1 span{background:linear-gradient(90deg,#fbbf24,#f472b6);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p.lead{font-size:18px;opacity:.82;max-width:560px}
.pill{display:inline-flex;gap:8px;align-items:center;font-size:13px;font-weight:600;padding:7px 14px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.18)}
.pill i{width:8px;height:8px;border-radius:50%;background:#34d399;box-shadow:0 0 0 4px rgba(52,211,153,.25)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:44px}
.stat{padding:16px;border-radius:16px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1)}
.stat .num{font-size:28px;font-weight:800}
.stat div:last-child{font-size:13px;opacity:.7}
.atom{position:relative;aspect-ratio:1;max-width:440px;margin:0 auto;width:100%}
.atom svg{width:100%;height:100%}
.orb{transform-origin:200px 200px;animation:spin 14s linear infinite}
.orb.b{animation-duration:18s;animation-direction:reverse}.orb.c{animation-duration:22s}
@keyframes spin{to{transform:rotate(360deg)}}
.fchip{position:absolute;padding:8px 14px;border-radius:12px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(6px);font-family:Montserrat;font-weight:700;font-size:15px;animation:float 6s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px)}}
section.blk{padding:84px 0}
.feat .card{transition:transform .2s,box-shadow .2s}
.feat .card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -20px rgba(20,26,51,.35)}
.fi{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;margin-bottom:14px;color:#fff}
.fi .ic{width:22px;height:22px}
.seccard{cursor:pointer;position:relative;overflow:hidden}
.seccard:hover{border-color:var(--pri)}
.seccard .big{position:absolute;right:-6px;bottom:-18px;font-family:Montserrat;font-weight:800;font-size:84px;color:var(--soft);z-index:0}
.seccard>*{position:relative;z-index:1}
.lb-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.lb-row:last-child{border:0}
.rank{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;font-weight:800;font-size:13px;background:#eef0f4}
.rank.r1{background:#fde68a;color:#78350f}.rank.r2{background:#e5e7eb;color:#374151}.rank.r3{background:#fed7aa;color:#7c2d12}
.step .n{width:38px;height:38px;border-radius:12px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-family:Montserrat}
.price.hot{background:linear-gradient(160deg,#1e1b4b,#3b2a8a);color:#fff;border:0;transform:scale(1.03)}
.price .num{font-size:32px;font-weight:800}
.price ul{list-style:none;margin:16px 0 20px;display:grid;gap:8px;font-size:14px}
.price li{display:flex;gap:8px}
.price li .ic{color:var(--ok);width:16px;height:16px;margin-top:3px}
.parentband{background:linear-gradient(135deg,#eef0ff,#fdf2f8);border-radius:28px;padding:40px}
.cta{background:radial-gradient(600px 300px at 80% 0,rgba(245,158,11,.35),transparent 60%),#0f1230;color:#fff;border-radius:28px;padding:48px;display:flex;gap:30px;align-items:center;justify-content:space-between;flex-wrap:wrap}
footer{padding:40px 0 60px;color:var(--muted);font-size:14px}

/* ---------- cabinet ---------- */
.cab{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:#aeb3d1;padding:22px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:3px}
.side .brand{color:#fff;padding:0 10px 18px;font-size:17px}
.side .who{display:flex;gap:10px;align-items:center;padding:12px;margin-bottom:12px;border-radius:14px;background:rgba(255,255,255,.06)}
.side .who b{color:#fff;font-size:14px;display:block}
.side .it{display:flex;gap:11px;align-items:center;padding:10px 12px;border-radius:11px;font-weight:500;font-size:14px;text-align:left;width:100%}
.side .it:hover{background:rgba(255,255,255,.06);color:#fff}
.side .it.on{background:linear-gradient(135deg,rgba(79,70,229,.9),rgba(124,58,237,.9));color:#fff}
.side .it .cnt{margin-left:auto;background:var(--acc);color:#2a1a00;font-size:11px;font-weight:800;padding:1px 7px;border-radius:99px}
.side .sp{flex:1}
.main{padding:26px 30px 40px;min-width:0}
.mhead{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px;flex-wrap:wrap}
.mhead h1{font-size:26px;letter-spacing:-.02em}
.xp{display:flex;align-items:center;gap:6px;font-weight:700;font-size:14px;padding:7px 12px;border-radius:99px;background:#fff;border:1px solid var(--line)}
.hello{background:radial-gradient(500px 240px at 100% 0,rgba(245,158,11,.35),transparent 60%),linear-gradient(135deg,#312e81,#6d28d9);color:#fff;border:0}
.hello .bar{background:rgba(255,255,255,.2)}.hello .bar>i{background:linear-gradient(90deg,#fbbf24,#f472b6)}
.kpi .num{font-size:26px;font-weight:800;margin-top:4px}
.kpi .lbl{font-size:13px;color:var(--muted)}
.list-it{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--line);background:#fff}
.list-it+.list-it{margin-top:10px}
.ti{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.tree .node{padding:2px 0}
.tree .nrow{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;cursor:pointer}
.tree .nrow:hover{background:var(--soft)}
.tree .nrow.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--pri)}
.tree .kids{margin-left:18px;border-left:1px dashed var(--line);padding-left:6px}
.tree .chev{transition:transform .2s;color:var(--muted)}
.tree .open>.nrow .chev{transform:rotate(90deg)}
.pct{margin-left:auto;font-size:12px;font-weight:700;min-width:38px;text-align:right}
.split{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:18px;align-items:start}
.sticky{position:sticky;top:20px}
.split.wide{grid-template-columns:minmax(300px,440px) 1fr}
.en .en-t{flex:1;min-width:0}.en .tag{white-space:nowrap}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
table.t td{padding:11px 12px;border-bottom:1px solid var(--line)}
table.t tr.me td{background:#fffbeb}
.tscroll{overflow-x:auto}
.podium{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:14px;align-items:end}
.pod{text-align:center;border-radius:18px;padding:18px 10px;color:#fff}
.pod .av{width:52px;height:52px;margin:0 auto 8px;font-size:18px;border:3px solid rgba(255,255,255,.5)}
.badge{text-align:center;padding:20px 14px}
.badge .bi{width:64px;height:64px;border-radius:20px;margin:0 auto 10px;display:grid;place-items:center;font-size:30px}
.badge.locked{opacity:.45;filter:grayscale(1)}
.opt{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:#fff;font-weight:500;transition:.15s}
.opt:hover{border-color:var(--pri)}
.opt .l{width:28px;height:28px;border-radius:8px;background:var(--soft);display:grid;place-items:center;font-weight:800;font-size:13px;color:var(--pri);flex:none}
.opt.right{border-color:var(--ok);background:#ecfdf5}.opt.wrong{border-color:var(--bad);background:#fef2f2}
.chart{width:100%;height:auto;display:block}
.ring{position:relative;width:120px;height:120px;margin:0 auto}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:Montserrat;font-size:24px}
.chat{height:min(560px,62vh);overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding:6px 4px}
.msg{max-width:82%;padding:12px 15px;border-radius:16px;font-size:14px;line-height:1.55}
.msg.ai{background:#fff;border:1px solid var(--line);border-top-left-radius:4px}
.msg.me{background:var(--pri);color:#fff;align-self:flex-end;border-top-right-radius:4px}
.dots span{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 2px;animation:blink 1s infinite}
.dots span:nth-child(2){animation-delay:.2s}.dots span:nth-child(3){animation-delay:.4s}
@keyframes blink{50%{opacity:.2}}
.en .en-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;cursor:pointer;margin-left:calc(var(--d)*20px)}
.en .en-row:hover{background:var(--soft)}
.en .en-row.sel{background:var(--soft);box-shadow:inset 3px 0 0 var(--pri)}
.en .en-t{font-weight:600;font-size:14px}
.en .en-act{margin-left:auto;display:flex;gap:2px;opacity:0;transition:.15s}
.en .en-row:hover .en-act,.en .en-row.sel .en-act{opacity:1}
.drop{border:2px dashed #c7cbe0;border-radius:16px;padding:26px;text-align:center;color:var(--muted);cursor:pointer;transition:.15s}
.drop:hover,.drop.over{border-color:var(--pri);background:var(--soft);color:var(--pri)}
.toggle{width:44px;height:26px;border-radius:99px;background:#d4d7e3;position:relative;flex:none;transition:.2s}
.toggle::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--ok)}.toggle.on::after{left:21px}
.sched{display:grid;grid-template-columns:60px repeat(6,1fr);gap:6px;font-size:13px}
.sched .c{min-height:54px;border-radius:10px;background:#fff;border:1px solid var(--line);padding:6px}
.sched .ls{background:linear-gradient(135deg,#eef0ff,#f5f3ff);border-color:#c7d2fe}
.sched .h{font-weight:700;text-align:center;color:var(--muted);padding:6px 0}
/* modal / toast */
.mback{position:fixed;inset:0;background:rgba(15,18,48,.55);backdrop-filter:blur(4px);display:grid;place-items:center;z-index:100;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:22px;width:100%;max-width:480px;max-height:90vh;overflow:auto;padding:26px;position:relative;animation:pop .2s}
.modal h3{font-size:21px;margin-bottom:4px}
.mx{position:absolute;right:14px;top:14px}
@keyframes fade{from{opacity:0}}@keyframes pop{from{transform:scale(.96);opacity:0}}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:#f1f2f7;padding:5px;border-radius:13px;margin-top:14px}
.seg button{padding:9px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 6px rgba(0,0,0,.08)}
/* feedback mode (desktop only) */
.fb-btn{position:fixed;right:22px;bottom:22px;z-index:90;display:none;align-items:center;gap:8px;padding:13px 18px;border-radius:99px;font-weight:700;background:#f59e0b;color:#2a1a00;box-shadow:0 10px 26px -8px rgba(245,158,11,.9)}
.fb-btn .n{background:#2a1a00;color:#fff;border-radius:99px;font-size:12px;padding:1px 8px}
.fb-btn.on{background:var(--ink);color:#fff}
body.fbm #app *{cursor:crosshair!important}
.fb-hl{outline:2px dashed #f59e0b!important;outline-offset:3px;border-radius:8px}
#fbbar{position:fixed;top:0;left:0;right:0;z-index:96;display:none;background:#f59e0b;color:#2a1a00;text-align:center;padding:9px 16px;font-weight:700;font-size:14px}
.fb-panel{position:fixed;right:22px;bottom:86px;width:380px;max-height:72vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 24px 60px -20px rgba(15,18,48,.45);z-index:95;padding:18px}
.fb-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.fb-pin{position:absolute;z-index:80;width:24px;height:24px;border-radius:50%;background:#f59e0b;color:#2a1a00;font-size:12px;font-weight:800;display:grid;place-items:center;box-shadow:0 0 0 3px #fff,0 4px 10px rgba(0,0,0,.25);cursor:pointer}
.fb-btn{display:inline-flex}
@media(max-width:860px){.fb-btn{right:12px;bottom:84px;padding:11px 15px;font-size:14px}.fb-panel{left:8px;right:8px;width:auto;bottom:140px;max-height:58vh}#fbbar{font-size:12px;padding:7px 10px}}
#toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:12px 18px;border-radius:14px;font-weight:600;font-size:14px;opacity:0;pointer-events:none;transition:.25s;z-index:200;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translateX(-50%)}
@media(max-width:980px){.split.wide{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:1fr 1fr}.hero-in{grid-template-columns:1fr}.atom{max-width:300px}.split{grid-template-columns:1fr}.sticky{position:static}}
@media(max-width:860px){
 .cab{grid-template-columns:1fr}
 .side{position:fixed;bottom:0;top:auto;height:auto;width:100%;flex-direction:row;overflow-x:auto;z-index:30;padding:8px;gap:4px}
 .side .brand,.side .who,.side .sp{display:none}
 .side .it{flex-direction:column;font-size:11px;gap:3px;padding:7px 10px;white-space:nowrap;width:auto;min-width:68px}
 .side .it .cnt{display:none}
 .main{padding:18px 16px 96px}
 .links{display:none}
}
@media(max-width:620px){
 .g2,.g2w,.g3{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}
 .nav-r .lang,.nav-r .btn-g{display:none}
 section.blk{padding:60px 0}.cta,.parentband{padding:28px}
 .podium{gap:8px}.price.hot{transform:none}
 .sched{grid-template-columns:44px repeat(6,minmax(70px,1fr));overflow-x:auto}
}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="fbbar" class="fb-ui">Пікір режимі: өзгерткіңіз келетін блокты басыңыз · шығу — төмендегі батырма</div>
<div id="fbpins" class="fb-ui" style="position:absolute;left:0;top:0"></div>
<div id="fbpanel" class="fb-ui"></div>
<button id="fbbtn" class="fb-btn fb-ui" onclick="fbToggle()"></button>
<script>
/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));

function leaves(nodes=S.tree,acc=[],path=[],forStudent=false){for(const n of nodes){if(forStudent&&n.hidden)continue;if(n.c&&n.c.length)leaves(n.c,acc,[...path,n.t],forStudent);else acc.push({id:n.id,t:n.t,path,root:path[0]||n.t})}return acc}
function find(id,nodes=S.tree,parent=null){for(let i=0;i<nodes.length;i++){const n=nodes[i];if(n.id===id)return{n,arr:nodes,i,parent};if(n.c){const r=find(id,n.c,n);if(r)return r}}return null}
function sc(st,id){if(String(id).startsWith('n'))return null;if(st.me&&MEOVR[id]!=null)return MEOVR[id];if(h(st.n+id+'x')<.1)return null;return Math.round(Math.min(100,Math.max(15,st.lvl*100-25+h(st.n+id)*50)))}
function avgOf(st,ids){const v=ids.map(id=>sc(st,id)).filter(x=>x!=null);return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null}
function nodeAvg(st,n){return avgOf(st,leaves([n]).map(l=>l.id))}
function xpOf(st){return Math.round(leaves().reduce((a,l)=>a+(sc(st,l.id)||0),0)*1.6+h(st.n+'xp')*600)+(st.me?S.xpb:0)}
function lvlOf(x){let i=0;LEVELS.forEach((l,k)=>{if(x>=l[0])i=k});const nx=LEVELS[i+1];return{i,name:LEVELS[i][1],next:nx?nx[0]:null,prev:LEVELS[i][0],nextName:nx?nx[1]:null}}
function scoreFor(st,scope,period){
 if(scope!=='all'){const s=sc(st,scope);return s==null?null:s}
 if(period==='week')return Math.round(h(st.n+'wk')*350+st.lvl*200)+(st.me?Math.min(S.xpb,300):0);
 if(period==='month')return Math.round(h(st.n+'mo')*900+st.lvl*900)+(st.me?S.xpb:0);
 return xpOf(st)}

function lineChart(data,{w=640,ht=230,labels=[],max=100,color='#4f46e5',unit='%'}={}){
 const pl=36,pr=14,pt=16,pb=30,iw=w-pl-pr,ih=ht-pt-pb;const x=i=>pl+i*iw/(data.length-1),y=v=>pt+ih-(v/max)*ih;
 const pts=data.map((v,i)=>`${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
 let g='';[0,25,50,75,100].forEach(v=>{g+=`<line x1="${pl}" x2="${w-pr}" y1="${y(v)}" y2="${y(v)}" stroke="#eceef5"/><text x="${pl-8}" y="${y(v)+4}" font-size="11" fill="#9aa0b8" text-anchor="end">${v}</text>`});
 labels.forEach((l,i)=>{if(l)g+=`<text x="${x(i)}" y="${ht-8}" font-size="11" fill="#9aa0b8" text-anchor="middle">${l}</text>`});
 const area=`M${x(0)},${y(0)} L${pts.replace(/ /g,' L')} L${x(data.length-1)},${y(0)} Z`;
 const dots=data.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="${i===data.length-1?5:3}" fill="${i===data.length-1?color:'#fff'}" stroke="${color}" stroke-width="2"><title>${labels[i]||''}: ${v}${unit}</title></circle>`).join('');
 return `<svg class="chart" viewBox="0 0 ${w} ${ht}"><defs><linearGradient id="ga" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".22"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#ga)"/><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}</svg>`}
function ring(v,max,color,label,sub){const r=50,c=2*Math.PI*r,p=Math.min(1,v/max);return `<div style="text-align:center"><div class="ring"><svg viewBox="0 0 120 120" width="120" height="120"><circle cx="60" cy="60" r="${r}" fill="none" stroke="#eceef5" stroke-width="11"/><circle cx="60" cy="60" r="${r}" fill="none" stroke="${color}" stroke-width="11" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 60 60)"/></svg><b>${label}</b></div><div class="small mt8" style="font-weight:600">${sub}</div></div>`}

   <div class="row wrapf mt12"><span class="tag ${clr(v)}">${v==null?'Әлі басталмаған':'Меңгеру: '+v+'%'}</span>${mr?`<span class="tag">Тақырып рейтингі: #${mr} / ${tr.length}</span>`:''}<span class="tag gray">+${S.game.test} XP тест үшін</span></div>

   <div class="row wrapf mt16"><button class="btn btn-p" onclick="startTest('${n.id}')">${ic('bolt')} Тақырып тестін бастау</button><button class="btn btn-g" onclick="S.rScope='${n.id}';tab('rating')">${ic('trophy')} Тақырып рейтингі</button><button class="btn btn-g" onclick="askTeacher('${esc(n.t).replace(/'/g,'')}')">Ағайдан сұрау</button></div></div>

function startTest(tid){S.test={i:0,pick:null,ok:0,done:false,topic:tid||null};if(S.view!=='student')S.view='student';tab('test')}
function sTest(){const T=S.test,q=QS[T.i];
 const title=T.topic?'Тақырып тесті: '+tname(T.topic):'ҰБТ форматындағы мини-сынақ';
 if(T.done){const p=Math.round(T.ok/QS.length*100),xp=T.ok*10;return head(title,'',xpPills())+`<div class="card" style="text-align:center;max-width:620px;margin:0 auto;padding:36px">
  <div style="font-size:56px">${p>=80?'🏆':p>=50?'💪':'📘'}</div><h2 style="font-size:28px;margin-top:8px">${T.ok} / ${QS.length} дұрыс</h2><p class="muted mt8">${p>=80?'Керемет нәтиже! Рейтингте жоғарыладың.':p>=50?'Жақсы! Қателерді талдап шық.':'Тақырыпты қайталап, қайта тапсырып көр.'}</p>
  <div class="row wrapf mt16" style="justify-content:center"><span class="tag ok">+${xp} XP</span><span class="tag">ҰБТ эквиваленті ≈ ${Math.round(p/2)}/50</span></div>
  <div class="row wrapf mt24" style="justify-content:center"><button class="btn btn-p" onclick="startTest(S.test.topic)">Қайта тапсыру</button><button class="btn btn-g" onclick="tab('rating')">Рейтингті көру</button></div></div>`}
 return head(title,`${T.i+1}-сұрақ / ${QS.length} · әр дұрыс жауап +10 XP`,`<span class="xp">${ic('check','color:#10b981')} ${T.ok} дұрыс</span>`)+`<div style="max-width:720px">
 <div class="bar"><i style="width:${T.i/QS.length*100}%"></i></div>
 <div class="card mt16"><span class="tag gray">Сұрақ ${T.i+1}</span><h3 style="font-size:19px;margin:14px 0 18px;line-height:1.4">${q.q}</h3>
  <div style="display:grid;gap:10px">${q.o.map((o,k)=>{let c='';if(T.pick!=null){if(k===q.a)c='right';else if(k===T.pick)c='wrong'}return `<button class="opt ${c}" ${T.pick!=null?'disabled':''} onclick="pick(${k})"><span class="l">${'ABCD'[k]}</span>${o}</button>`}).join('')}</div>
  ${T.pick!=null?`<div class="msg ai mt16" style="max-width:100%;background:${T.pick===q.a?'#ecfdf5':'#fef2f2'}"><b>${T.pick===q.a?'✅ Дұрыс!':'❌ Қате.'}</b> ${q.e}</div><button class="btn btn-p mt16" onclick="nextQ()">${T.i+1<QS.length?'Келесі сұрақ':'Нәтижені көру'} ${ic('chev')}</button>`:`<div class="row mt16"><button class="btn btn-g btn-s" onclick="toast('Кеңес: формулалар парағын қара (демо)')">💡 Кеңес (−5 XP)</button></div>`}
 </div></div>`}
function pick(k){const T=S.test;T.pick=k;if(k===QS[T.i].a)T.ok++;render()}
function nextQ(){const T=S.test;if(T.i+1<QS.length){T.i++;T.pick=null}else{T.done=true;S.xpb+=T.ok*10;save()}render()}

 <button class="btn btn-a mt16" style="width:100%" onclick="fbAdd()">Сақтау</button>`);setTimeout(()=>{const t=$('#fb_t');if(t)t.focus()},50)}

const _render=render;render=function(){_render();drawPins()};
